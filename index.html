<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Co na obiad?</title>
<style>
:root{--bg:#fbf6ef;--card:#fff;--tx:#2b2118;--mu:#7a6a5a;--ac:#d9622b;--ac2:#fde8dc;--bd:#eadfd1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1612;--card:#272019;--tx:#f3eadf;--mu:#b3a393;--ac:#f08a52;--ac2:#3a2a20;--bd:#3a3027;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1612;--card:#272019;--tx:#f3eadf;--mu:#b3a393;--ac:#f08a52;--ac2:#3a2a20;--bd:#3a3027;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:1.5rem;margin:8px 0 14px}
h2{font-size:1.2rem;margin:18px 0 8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:12px 4px;font-size:.9rem;color:var(--mu);cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}
nav button span{display:block;font-size:1.3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer}
.card .ph,.hero{aspect-ratio:4/3;width:100%;object-fit:cover;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:2.5rem}
.card .t{padding:10px;font-weight:600;font-size:.95rem}
.hero{border-radius:14px;margin-bottom:10px}
button.b,a.b{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-size:1rem;cursor:pointer;font-weight:600}
button.g{background:var(--ac2);color:var(--ac)}
button.d{background:none;color:#c0392b;border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:block;font-weight:600;margin:14px 0 4px;font-size:.9rem}
input,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
textarea{min-height:120px}
.hint{color:var(--mu);font-size:.85rem}
.stepper{display:inline-flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px 8px}
.stepper button{width:36px;height:36px;border-radius:50%;border:0;background:var(--ac2);color:var(--ac);font-size:1.3rem;cursor:pointer}
.stepper b{min-width:24px;text-align:center}
ul.ing{list-style:none;padding:0;margin:0}
ul.ing li{padding:8px 0;border-bottom:1px solid var(--bd)}
ol.st{padding-left:20px}
ol.st li{margin-bottom:8px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.dice{text-align:center;padding:10px 0}
.dice .big{font-size:4rem}
.scan{background:var(--ac2);border-radius:14px;padding:12px;margin-bottom:6px}.scan input{background:var(--card);margin-top:8px}
.cook{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
.cook .top{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.cook .body{flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:center}
.cook .step{font-size:1.6rem;line-height:1.4}
.cook .bar{height:6px;background:var(--bd);border-radius:3px;margin-bottom:6px}.cook .bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.cook .nav{display:flex;gap:10px;margin-top:10px}.cook .nav button{flex:1;padding:18px}
.chk{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);font-size:1.15rem;font-weight:400;margin:0}.chk input{width:24px;height:24px;flex:none}.chk.done span{text-decoration:line-through;opacity:.5}
details.more{margin-top:14px}details.more summary{cursor:pointer;font-weight:600;color:var(--ac)}
a.b{display:inline-block;text-decoration:none}a.g{background:var(--ac2);color:var(--ac)}
.hist{color:var(--mu);font-size:.9rem;margin:8px 0}
#print{display:none}
@media print{
 html,body{background:#fff!important;color:#000!important}
 body>*:not(#print){display:none!important}
 #print{display:block;font-family:Georgia,serif;font-size:12pt;line-height:1.5}
 #print h1{font-size:22pt;margin:0 0 4pt}#print h2{font-size:14pt;margin:16pt 0 6pt;border-bottom:1px solid #999}
 #print img{max-width:100%;max-height:9cm;object-fit:cover;border-radius:6px;margin:8pt 0}
 #print li{margin-bottom:4pt;break-inside:avoid}#print .src{margin-top:18pt;font-size:10pt;color:#555;word-break:break-all}
}
.sync{font-size:.8rem;color:var(--mu);margin-top:20px}
</style>
</head>
<body>
<main id="app"></main>
<div id="print"></div>
<nav>
  <button data-v="list"><span>📖</span>Dania</button>
  <button data-v="rand"><span>🎲</span>Losuj</button>
  <button data-v="form"><span>➕</span>Dodaj</button>
</nav>
<script>
var recipes = [], view = 'list', cur = null, servings = 2, photo = '', editId = null, rnd = null, mode = 'local', db = null;
var LS = 'obiady-v1';
var app = document.getElementById('app');

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function byId(id){return (sharedR&&sharedR.id===id)?sharedR:recipes.filter(function(r){return r.id===id})[0]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- zapis ---------- */
function loadLocal(){try{recipes=JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){recipes=[]}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(recipes))}catch(e){alert('Brak miejsca w pamięci przeglądarki – użyj mniejszego zdjęcia.')}}
async function saveRecipe(r){
  if(mode==='db'){try{await db.collection('recipes').doc(r.id).set(r);return}catch(e){alert('Nie udało się zapisać we wspólnej bazie.');return}}
  var i=recipes.findIndex(function(x){return x.id===r.id});
  if(i>=0)recipes[i]=r;else recipes.push(r);
  saveLocal();
}
async function removeRecipe(id){
  if(mode==='db'){try{await db.collection('recipes').doc(id).delete()}catch(e){}return}
  recipes=recipes.filter(function(x){return x.id!==id});saveLocal();
}

/* ---------- składniki i proporcje ---------- */
function fmt(n){
  var r=Math.round(n*100)/100;
  return String(r).replace('.',',');
}
function scaleLine(line,factor){
  var m=line.match(/^\s*(\d+\s*\/\s*\d+|\d+(?:[.,]\d+)?)\s*(.*)$/);
  if(!m)return esc(line.trim());
  var q=m[1],v;
  if(q.indexOf('/')>-1){var p=q.split('/');v=parseFloat(p[0])/parseFloat(p[1]);}
  else v=parseFloat(q.replace(',','.'));
  return '<b>'+fmt(v*factor)+'</b> '+esc(m[2]);
}
function lines(t){return String(t||'').split('\n').map(function(s){return s.trim()}).filter(Boolean)}

/* ---------- widoki ---------- */
function render(){
  document.querySelectorAll('nav button').forEach(function(b){
    b.classList.toggle('on',b.dataset.v===view||(view==='detail'&&b.dataset.v==='list'));
  });
  if(view==='list')renderList();
  else if(view==='detail')renderDetail();
  else if(view==='rand')renderRand();
  else if(view==='cook')renderCook();
  else renderForm();
  window.scrollTo(0,0);
}
function thumb(r,cls){return r.photo?'<img class="'+cls+'" src="'+r.photo+'" alt="">':'<div class="'+cls+'">🍽️</div>'}
function renderList(){
  var h='<h1>Nasze obiady</h1>';
  if(!recipes.length){
    h+='<div class="empty">Na razie pusto.<br>Dodaj pierwsze danie, żeby zacząć.<br><br><button class="b" onclick="go(\'form\')">Dodaj danie</button></div>';
  } else {
    h+='<div class="grid">'+recipes.slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'','pl')}).map(function(r){
      return '<div class="card" onclick="open_(\''+r.id+'\')">'+thumb(r,'ph')+'<div class="t">'+esc(r.name)+((r.cooked&&r.cooked.length)?' <span class="hint">🍳×'+r.cooked.length+'</span>':'')+'</div></div>';
    }).join('')+'</div>';
  }
  h+='<div class="row" style="margin-top:22px"><button class="b g" onclick="backup()">⬇️ Zapisz kopię</button><button class="b g" onclick="document.getElementById(\'rf\').click()">⬆️ Wczytaj kopię</button><input id="rf" type="file" accept=".json,application/json" onchange="restore(this)" style="display:none"></div>';
  h+='<div class="sync">'+(mode==='db'?'☁️ Wspólna baza – widzą ją wszyscy, którym udostępnisz stronę.':'📱 Dane zapisane tylko na tym urządzeniu.')+'</div>';
  app.innerHTML=h;
}
function renderDetail(){
  var r=byId(cur);if(!r){view='list';return render()}
  var f=servings/(r.servings||1);
  var h='<button class="b g" onclick="go(\'list\')">← Wróć</button>';
  h+='<h1 style="margin-top:14px">'+esc(r.name)+'</h1>'+(r.photo?thumb(r,'hero'):'');
  var n=(r.cooked||[]).length;
  h+='<div class="row" style="margin-bottom:8px">'+((lines(r.ing).length||lines(r.steps).length)?'<button class="b" onclick="startCook()">👩‍🍳 Zacznij gotować</button>':'')+(r.url?'<a class="b g" href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer">🔗 Oryginał</a>':'')+'</div>';
  h+='<div class="hist">'+(n?'🍳 Gotowane '+n+' ×, ostatnio '+new Date(r.cooked[n-1]).toLocaleDateString('pl-PL'):'Jeszcze nie gotowane')+'</div>';
  if(!lines(r.ing).length)h+='<div class="scan">Brak składników i kroków. <a href="#" onclick="edit(\''+r.id+'\');return false" style="color:var(--ac)">Uzupełnij przepis</a></div>';
  h+='<div class="row"><span>Porcje:</span><div class="stepper"><button onclick="chg(-1)">−</button><b>'+servings+'</b><button onclick="chg(1)">+</button></div>'
   +'<span class="hint">(przepis na '+(r.servings||1)+')</span></div>';
  h+='<h2>Składniki</h2><ul class="ing">'+lines(r.ing).map(function(l){return '<li>'+scaleLine(l,f)+'</li>'}).join('')+'</ul>';
  h+='<h2>Przygotowanie</h2><ol class="st">'+lines(r.steps).map(function(l){return '<li>'+esc(l.replace(/^\d+[.)]\s*/,''))+'</li>'}).join('')+'</ol>';
  if(sharedR&&r===sharedR)h+='<div class="row" style="margin-top:20px"><button class="b" onclick="saveShared()">💾 Zapisz do mojej listy</button></div><div class="hint">To przepis udostępniony przez link. Możesz od razu gotować albo zapisać go u siebie.</div>';else h+='<div class="row" style="margin-top:20px"><button class="b" onclick="cooked(\''+r.id+'\')">✅ Ugotowaliśmy dziś</button>'+(n?'<button class="b g" onclick="uncook(\''+r.id+'\')">Cofnij wpis</button>':'')+'</div><div class="row" style="margin-top:12px"><button class="b g" onclick="shareText(\''+r.id+'\')">💬 Wyślij tekst</button><button class="b g" onclick="makePdf(\''+r.id+'\')">📄 Utwórz PDF</button><button class="b g" onclick="edit(\''+r.id+'\')">Edytuj</button><button class="b d" onclick="del(\''+r.id+'\')">Usuń</button></div>';
  app.innerHTML=h;
}
function renderRand(){
  var h='<h1>Co dziś jemy?</h1>';
  if(!recipes.length){app.innerHTML=h+'<div class="empty">Dodaj najpierw kilka dań, a potem losuj.</div>';return}
  var r=rnd&&byId(rnd);
  h+='<div class="dice">';
  if(r){h+='<div class="card" onclick="open_(\''+r.id+'\')" style="margin-bottom:16px">'+thumb(r,'ph')+'<div class="t" style="font-size:1.2rem">'+esc(r.name)+'</div></div>'
    +'<div class="row" style="justify-content:center"><button class="b" onclick="open_(\''+r.id+'\')">Zobacz przepis</button><button class="b g" onclick="roll()">Losuj ponownie</button></div>';}
  else h+='<div class="big">🎲</div><p class="hint">Nie możecie się zdecydować? Niech zdecyduje los. Częściej trafiają się dania, których dawno nie gotowaliście.</p><button class="b" onclick="roll()">Losuj danie</button>';
  app.innerHTML=h+'</div>';
}
function renderForm(){
  var r=editId?byId(editId):null;
  var h='<h1>'+(r?'Edytuj danie':'Nowe danie')+'</h1>';
  if(aiOk&&!r)h+='<div class="scan"><b>✨ Wczytaj przepis ze screena</b><div class="hint">Wybierz zrzut ekranu lub wklej go (Ctrl+V). AI uzupełni pola poniżej, a Ty je sprawdzisz i poprawisz.</div><input type="file" accept="image/*" onchange="scanFile(this)"><div id="scan-st" class="hint"></div></div>';
  h+='<label>Nazwa</label><input id="f-name" value="'+esc(r?r.name:'')+'" placeholder="np. Spaghetti bolognese">';
  h+='<label>Link do źródła (opcjonalnie)</label><input id="f-url" type="url" inputmode="url" value="'+esc(r?r.url||'':'')+'" placeholder="https://instagram.com/…">';
  h+='<label>Zdjęcie</label><input id="f-photo" type="file" accept="image/*" onchange="pickPhoto(this)"><div id="f-prev" style="margin-top:8px">'+(photo?'<img class="hero" src="'+photo+'" alt="">':'')+'</div>';
  h+='<details class="more" id="f-more"'+(r&&(r.ing||r.steps)?' open':'')+'><summary>Składniki i kroki (możesz dopisać później)</summary>';
  h+='<label>Dla ilu porcji jest przepis?</label><input id="f-serv" type="number" min="1" value="'+(r?r.servings:2)+'">';
  h+='<label>Składniki (każdy w osobnej linii)</label><textarea id="f-ing" placeholder="200 g makaronu&#10;1/2 cebuli&#10;2 ząbki czosnku">'+esc(r?r.ing:'')+'</textarea>'
    +'<div class="hint">Zacznij linię od liczby – wtedy ilość przeliczy się przy zmianie porcji. Możesz użyć ułamków (1/2) i przecinka (0,5).</div>';
  h+='<label>Sposób przygotowania (każdy krok w osobnej linii)</label><textarea id="f-steps" placeholder="Ugotuj makaron.&#10;Podsmaż cebulę.">'+esc(r?r.steps:'')+'</textarea>';
  h+='</details>';
  h+='<div class="row" style="margin-top:18px"><button class="b" onclick="submitForm()">Zapisz</button>'+(r?'<button class="b g" onclick="open_(\''+r.id+'\')">Anuluj</button>':'')+'</div>';
  app.innerHTML=h;
}

/* ---------- akcje ---------- */
function go(v){if(v==='form'){editId=null;photo=''}view=v;render()}
function open_(id){cur=id;var r=byId(id);servings=r?(r.servings||2):2;view='detail';render()}
function chg(d){servings=Math.max(1,servings+d);renderDetail()}
function roll(){
  if(!recipes.length)return;
  var pool=recipes.filter(function(r){return r.id!==rnd});
  if(!pool.length)pool=recipes;
  var now=Date.now(),w=pool.map(function(r){var c=r.cooked||[];return c.length?1+Math.min((now-c[c.length-1])/864e5,60)/10:7});
  var t=Math.random()*w.reduce(function(a,b){return a+b},0),i=0;
  while(i<w.length-1&&(t-=w[i])>0)i++;
  rnd=pool[i].id;renderRand();
}
function edit(id){editId=id;photo=byId(id).photo||'';view='form';render()}
async function del(id){
  if(!confirm('Na pewno usunąć to danie?'))return;
  await removeRecipe(id);view='list';render();
}
function pickPhoto(inp){
  var file=inp.files&&inp.files[0];if(!file)return;
  var img=new Image(),url=URL.createObjectURL(file);
  img.onload=function(){
    var max=800,s=Math.min(1,max/Math.max(img.width,img.height));
    var c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    photo=c.toDataURL('image/jpeg',0.7);URL.revokeObjectURL(url);
    document.getElementById('f-prev').innerHTML='<img class="hero" src="'+photo+'" alt="">';
  };
  img.src=url;
}
async function submitForm(){
  var name=document.getElementById('f-name').value.trim();
  if(!name){alert('Podaj nazwę dania.');return}
  var r={
    id:editId||uid(),name:name,photo:photo,url:normUrl(document.getElementById('f-url').value),cooked:editId?(byId(editId).cooked||[]):[],
    servings:Math.max(1,parseInt(document.getElementById('f-serv').value,10)||2),
    ing:document.getElementById('f-ing').value,steps:document.getElementById('f-steps').value
  };
  await saveRecipe(r);
  editId=null;photo='';
  if(!byId(r.id)){recipes.push(r)}
  open_(r.id);
}

var aiOk=false, sample=null;
function scanStatus(t){var e=document.getElementById('scan-st');if(e)e.textContent=t}
function scanFile(inp){if(inp.files&&inp.files[0])scanBlob(inp.files[0])}
async function scanBlob(file){
  if(!sample)return;
  scanStatus('⏳ Odczytuję przepis…');
  try{
    var bmp=await new Promise(function(ok,no){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){URL.revokeObjectURL(u);ok(im)};im.onerror=no;im.src=u});
    var s=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
    c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    var blob=await new Promise(function(ok){c.toBlob(ok,'image/jpeg',0.85)});
    var prompt='Odczytaj przepis kulinarny ze zrzutu ekranu. Zwróć wyłącznie JSON bez markdownu: {"name":string,"servings":number,"ing":string,"steps":string}. Pole ing: każdy składnik w osobnej linii (znak nowej linii), ilość na początku linii, jeśli jest podana, np. 200 g makaronu; ułamki zapisuj jako 1/2. Pole steps: każdy krok w osobnej linii, bez numeracji. Pisz po polsku, niczego nie wymyślaj ponad to, co widać na obrazie. Jeśli nie ma liczby porcji, wpisz 2.';
    var d=await sample.json(prompt,{images:[blob],cache:false});
    var set=function(id,v){var e=document.getElementById(id);if(e&&v!=null&&String(v).trim())e.value=v};
    set('f-name',d.name);set('f-serv',d.servings);set('f-ing',d.ing);set('f-steps',d.steps);var mo=document.getElementById('f-more');if(mo)mo.open=true;
    scanStatus('✅ Gotowe. Sprawdź, czy wszystko się zgadza, i dodaj zdjęcie dania.');
  }catch(e){
    scanStatus(e&&e.code==='not_granted'?'Brak zgody na użycie AI.':e&&e.code==='rate_limited'?'Za dużo prób, spróbuj za chwilę.':'Nie udało się odczytać przepisu. Spróbuj ostrzejszego zrzutu ekranu.');
  }
}
document.addEventListener('paste',function(e){
  if(view!=='form'||!aiOk||editId)return;
  var items=(e.clipboardData&&e.clipboardData.items)||[];
  for(var i=0;i<items.length;i++){if(items[i].type.indexOf('image/')===0){e.preventDefault();scanBlob(items[i].getAsFile());return}}
});
(async function(){
  try{
    if(!window.claude||!claude.use)return;
    var sm=await claude.use('sample');
    if(!sm)return;
    var lim=await sm.limits();
    if(!lim||!lim.images)return;
    sample=sm;aiOk=true;
    if(view==='form'&&!editId)render();
  }catch(e){}
})();
function normUrl(u){u=(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{new URL(u);return u}catch(e){return ''}}
/* tryb gotowania */
var cookTab='ing',cookStep=0,chk={},wl=null,tx=null;
async function wake(){try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}}
function unwake(){try{wl&&wl.release()}catch(e){}wl=null}
function startCook(){cookTab='ing';cookStep=0;chk={};view='cook';wake();render()}
function endCook(){unwake();view='detail';render()}
function cookTabSet(t){cookTab=t;renderCook()}
function tick(i){chk[i]=!chk[i];renderCook()}
function stepGo(d){var n=lines(byId(cur).steps).length;cookStep+=d;if(cookStep>=n){cooked(cur,true);return}cookStep=Math.max(0,cookStep);renderCook()}
function renderCook(){
  var r=byId(cur);if(!r){view='list';return render()}
  var f=servings/(r.servings||1),st=lines(r.steps),ig=lines(r.ing),n=st.length||1;
  var h='<div class="cook"><div class="top"><b>'+esc(r.name)+'</b><button class="b g" onclick="endCook()">✕ Zamknij</button></div>';
  h+='<div class="row" style="margin-bottom:10px"><button class="b '+(cookTab==='ing'?'':'g')+'" onclick="cookTabSet(\'ing\')">Składniki ('+servings+' porcji)</button><button class="b '+(cookTab==='steps'?'':'g')+'" onclick="cookTabSet(\'steps\')">Kroki</button></div>';
  if(cookTab==='ing'){
    h+='<div class="body" style="justify-content:flex-start">'+(ig.map(function(l,i){return '<label class="chk'+(chk[i]?' done':'')+'"><input type="checkbox" '+(chk[i]?'checked ':'')+'onchange="tick('+i+')"><span>'+scaleLine(l,f)+'</span></label>'}).join('')||'<div class="empty">Brak składników.</div>')+'</div>';
    h+='<div class="nav"><button class="b" onclick="cookTabSet(\'steps\')">Do kroków →</button></div>';
  } else {
    h+='<div class="bar"><i style="width:'+((cookStep+1)/n*100)+'%"></i></div><div class="hint">Krok '+(cookStep+1)+' z '+n+'</div>';
    h+='<div class="body"><div class="step">'+esc((st[cookStep]||'Brak kroków w tym przepisie.').replace(/^\d+[.)]\s*/,''))+'</div></div>';
    h+='<div class="nav"><button class="b g" onclick="stepGo(-1)">← Wstecz</button><button class="b" onclick="stepGo(1)">'+(cookStep>=n-1?'Ugotowane ✅':'Dalej →')+'</button></div>';
  }
  app.innerHTML=h+'</div>';
}
document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){
  if(view!=='cook'||cookTab!=='steps'||tx==null)return;
  var dx=e.changedTouches[0].clientX-tx,n=lines((byId(cur)||{}).steps).length;tx=null;
  if(Math.abs(dx)>70){if(dx<0){if(cookStep<n-1)stepGo(1)}else stepGo(-1)}
});
document.addEventListener('visibilitychange',function(){if(view==='cook'&&!document.hidden)wake()});
/* udostępnianie linkiem */
var sharedR=null;
function enc(r){var o={n:r.name,s:r.servings,i:r.ing,t:r.steps,u:r.url||''},b=new TextEncoder().encode(JSON.stringify(o)),s='';b.forEach(function(x){s+=String.fromCharCode(x)});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(c){c=c.replace(/-/g,'+').replace(/_/g,'/');var s=atob(c),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return JSON.parse(new TextDecoder().decode(b))}
async function shareLink(id){
  var r=byId(id),link=location.origin+location.pathname+'#p'+enc(r);
  try{if(navigator.share){await navigator.share({title:r.name,text:r.name+' – przepis',url:link});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(link);alert('Link skopiowany. Wklej go w wiadomości.')}catch(e){prompt('Skopiuj link:',link)}
}
function loadShared(){
  var h=location.hash;if(h.indexOf('#p')!==0||h.length<4)return;
  try{var o=dec(h.slice(2));if(!o||!o.n)return;
    sharedR={id:'shared',name:String(o.n),servings:Math.max(1,parseInt(o.s,10)||2),ing:String(o.i||''),steps:String(o.t||''),url:normUrl(o.u),photo:'',cooked:[]};
    open_('shared');
  }catch(e){}
}
async function saveShared(){
  var r=Object.assign({},sharedR,{id:uid(),cooked:[]});
  await saveRecipe(r);if(!byId(r.id))recipes.push(r);
  sharedR=null;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  open_(r.id);
}
window.addEventListener('hashchange',loadShared);
/* udostępnianie tekstem */
function plain(l,f){var d=document.createElement('div');d.innerHTML=scaleLine(l,f);return d.textContent}
async function shareText(id){
  var r=byId(id),base=r.servings||1,s=(cur===id&&view==='detail')?servings:base,f=s/base;
  var ig=lines(r.ing),st=lines(r.steps),t='🍽️ '+r.name+' ('+s+' porcji)\n\n';
  if(ig.length)t+='Składniki:\n'+ig.map(function(l){return '• '+plain(l,f)}).join('\n')+'\n\n';
  if(st.length)t+='Przygotowanie:\n'+st.map(function(l,i){return (i+1)+'. '+l.replace(/^\d+[.)]\s*/,'')}).join('\n')+'\n';
  if(r.url)t+='\nOryginał: '+r.url;
  try{if(navigator.share){await navigator.share({title:r.name,text:t});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(t);alert('Przepis skopiowany. Wklej go w wiadomości.')}catch(e){prompt('Skopiuj przepis:',t)}
}
/* PDF */
function makePdf(id){
  var r=byId(id);if(!r)return;
  var base=r.servings||1,s=(cur===id&&view==='detail')?servings:base,f=s/base;
  var ig=lines(r.ing),st=lines(r.steps);
  var h='<h1>'+esc(r.name)+'</h1><p>Porcje: '+s+'</p>'+(r.photo?'<img src="'+r.photo+'" alt="">':'');
  if(ig.length)h+='<h2>Składniki</h2><ul>'+ig.map(function(l){return '<li>'+scaleLine(l,f)+'</li>'}).join('')+'</ul>';
  if(st.length)h+='<h2>Przygotowanie</h2><ol>'+st.map(function(l){return '<li>'+esc(l.replace(/^\d+[.)]\s*/,''))+'</li>'}).join('')+'</ol>';
  if(r.url)h+='<p class="src">Źródło: '+esc(r.url)+'</p>';
  document.getElementById('print').innerHTML=h;
  var prev=document.title;document.title=r.name;
  window.print();
  setTimeout(function(){document.title=prev},1500);
}
/* historia */
async function cooked(id,fc){var r=byId(id);if(!r)return;if(sharedR&&r===sharedR){unwake();view='detail';render();return}r.cooked=(r.cooked||[]).concat(Date.now());await saveRecipe(r);if(fc)unwake();view='detail';render()}
async function uncook(id){var r=byId(id);if(!r||!(r.cooked||[]).length)return;r.cooked=r.cooked.slice(0,-1);await saveRecipe(r);render()}
/* kopia zapasowa */
async function backup(){
  var data=JSON.stringify({app:'obiady',v:1,recipes:recipes}),name='obiady-kopia-'+new Date().toISOString().slice(0,10)+'.json';
  var file=new File([data],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Kopia dań'});return}}catch(e){if(e&&e.name==='AbortError')return}
  var a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function restore(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=async function(){
    try{
      var d=JSON.parse(rd.result),list=Array.isArray(d)?d:d.recipes;
      list=(list||[]).filter(function(x){return x&&x.id&&x.name});
      if(!list.length){alert('W tym pliku nie znalazłem żadnych dań.');return}
      if(!confirm('Wczytać dań: '+list.length+'? Dania o tych samych identyfikatorach zostaną zastąpione.'))return;
      for(var i=0;i<list.length;i++)await saveRecipe(list[i]);
      alert('Wczytano dań: '+list.length);view='list';render();
    }catch(e){alert('To nie wygląda na plik kopii z tej aplikacji.')}
  };
  rd.readAsText(f);inp.value='';
}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){go(b.dataset.v)}});

/* ---------- start ---------- */
loadLocal();render();loadShared();
(async function(){
  try{
    if(!window.claude||!claude.use)return;
    var d=await claude.use('db');
    if(!d)return;
    db=d;mode='db';
    var local=recipes.slice();
    db.collection('recipes').onSnapshot(function(snap){
      recipes=snap.docs.map(function(x){return x.data()});
      if(view==='list'||view==='rand')render();
      else if(view==='detail'&&!byId(cur)){view='list';render()}
    },function(){});
    /* przenieś dania zapisane lokalnie do wspólnej bazy */
    if(local.length){
      for(var i=0;i<local.length;i++){try{await db.collection('recipes').doc(local[i].id).set(local[i])}catch(e){}}
      try{localStorage.removeItem(LS)}catch(e){}
    }
  }catch(e){}
})();
</script>
